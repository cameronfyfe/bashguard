# Azure CLI command map for bashguard
#
# Capabilities:
#   az.read        - Reading Azure resources (list, show, get)
#   az.write       - Creating/modifying resources (create, update, set)
#   az.delete      - Deleting resources
#   az.auth        - Authentication and authorization
#   az.config      - CLI configuration
#   az.compute     - Virtual machine operations
#   az.network     - Networking operations
#   az.storage     - Storage operations
#   az.aks         - Kubernetes service operations
#   az.acr         - Container registry operations
#   az.keyvault    - Key vault operations
#   az.sql         - SQL database operations
#   az.cosmosdb    - Cosmos DB operations
#   az.monitor     - Monitoring operations
#   az.iam         - Identity and access management

cmd = "az"
capabilities = ["az.read"]

