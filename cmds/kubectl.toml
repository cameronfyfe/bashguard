# Kubectl command map for bashguard
#
# Capabilities:
#   kubectl.read-local    - Reading cluster state (get, describe, logs)
#   kubectl.write-local   - Modifying cluster state (apply, create, patch, label)
#   kubectl.delete        - Deleting resources
#   kubectl.exec          - Executing commands in containers
#   kubectl.port-forward  - Port forwarding to pods/services
#   kubectl.auth          - Authentication and authorization
#   kubectl.config        - Cluster configuration changes
#   kubectl.drain         - Draining nodes (disruptive)
#   kubectl.debug         - Debug operations

cmd = "kubectl"
capabilities = ["kubectl.read-local"]

[[subcmds]]
cmd = "get"
capabilities = ["kubectl.read-local"]

