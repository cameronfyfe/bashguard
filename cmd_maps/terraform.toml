# Terraform command map for bashguard
#
# Capabilities:
#   terraform.read-local   - Reading state and plans (plan, show, output)
#   terraform.write-local  - Modifying infrastructure (apply, import)
#   terraform.init         - Initializing providers and modules
#   terraform.destroy      - Destroying infrastructure
#   terraform.state        - Direct state manipulation
#   terraform.auth         - Authentication operations
#   terraform.workspace    - Workspace management
#   terraform.providers    - Provider management

cmd = "terraform"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "plan"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "show"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "output"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "validate"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "fmt"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "version"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "graph"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "console"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "test"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "metadata"
capabilities = ["terraform.read-local"]

[[subcmds]]
cmd = "apply"
capabilities = ["terraform.write-local"]

[[subcmds]]
cmd = "import"
capabilities = ["terraform.write-local"]

[[subcmds]]
cmd = "refresh"
capabilities = ["terraform.write-local"]

[[subcmds]]
cmd = "taint"
capabilities = ["terraform.write-local"]

[[subcmds]]
cmd = "untaint"
capabilities = ["terraform.write-local"]

[[subcmds]]
cmd = "init"
capabilities = ["terraform.init"]

[[subcmds]]
cmd = "get"
capabilities = ["terraform.init"]

[[subcmds]]
cmd = "destroy"
capabilities = ["terraform.destroy"]

[[subcmds]]
cmd = "state"
capabilities = ["terraform.state"]

[[subcmds.subcmds]]
cmd = "list"
capabilities = ["terraform.read-local"]

[[subcmds.subcmds]]
cmd = "show"
capabilities = ["terraform.read-local"]

[[subcmds.subcmds]]
