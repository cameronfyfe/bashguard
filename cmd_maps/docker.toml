# Docker command map for bashguard
#
# Capabilities:
#   docker.read-local   - Reading container/image info (ps, images, inspect, logs, stats)
#   docker.write-local  - Modifying local state (rm, rmi, tag, commit, create)
#   docker.run          - Running containers (run, compose up)
#   docker.exec         - Executing commands in containers
#   docker.build        - Building images
#   docker.pull         - Pulling images from registry
#   docker.push         - Pushing images to registry
#   docker.lifecycle    - Container lifecycle (start, stop, restart, kill, pause)
#   docker.network      - Network operations
#   docker.volume       - Volume operations
#   docker.compose      - Docker compose operations
#   docker.auth         - Login/logout operations
#   docker.privileged   - Added by --privileged flag (dangerous)
#   docker.mount        - Added by -v/--volume/--mount flags (host filesystem access)

cmd = "docker"

# Top-level management commands
[[subcmds]]
cmd = "build"
capabilities = ["docker.build"]
flags_add_capabilities = { "--push" = ["docker.push"] }

