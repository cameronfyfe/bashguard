# Bashguard configuration

[settings]
# Default action for commands that don't match any rule
# Options: "allow", "deny", "prompt"
default_action = "prompt"

# Log all decisions to .bashguard/logs/
log_decisions = true

# Global capability policies
# Format: "<capability>" = "<action>" where action is allow/deny/prompt
#
# Run `bashguard capabilities` to see all available capabilities
# Run `bashguard capabilities --format toml` to get a copy-pasteable list

[capabilities]
# Safe read-only operations - allowed by default
"az.read" = "allow"
"cargo.build" = "allow"
"cargo.read-local" = "allow"
"docker.read-local" = "allow"
"fs.read" = "allow"
"git.read-local" = "allow"
"kubectl.read-local" = "allow"
"terraform.read-local" = "allow"

