# Bashguard configuration

[settings]
# Default action for commands that don't match any rule
# Options: "allow", "deny", "prompt"
default_action = "prompt"

# Log all decisions to .bashguard/logs/
log_decisions = true

# Global capability policies
# Format: "<capability>" = "<action>" where action is allow/deny/prompt
[capabilities]
# "git.read-local" = "allow"
# "git.write-local" = "prompt"
# "git.pull" = "allow"
# "git.push" = "prompt"
# "git.force_push" = "deny"

# Optional inline rules (applied after capability deny checks)
# [[rules]]
# program = "rm"
# flags_present = ["-rf"]
# action = "deny"
# message = "Recursive force delete is not allowed"
